<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工资考勤管理系统</title>
  <style>
    html,body{height:100%;margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f6f8fc;color:#0f172a}
    .loading{height:100%;display:grid;place-items:center}.box{text-align:center;padding:32px}.dot{width:38px;height:38px;margin:0 auto 16px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><div class="box"><div class="dot"></div><div>工资系统加载中…</div></div></div>
  <noscript>请启用 JavaScript 后使用工资考勤管理系统。</noscript>
  <script>
  (async()=>{
    try{
      const read=async path=>{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error(`加载 ${path} 失败`);return r.text()};
      const b64Files=Array.from({length:5},(_,i)=>`payload/${String(i).padStart(2,"0")}.b64`);
      const hexFiles=Array.from({length:4},(_,i)=>`payload/${String(i+5).padStart(2,"0")}.hex`);
      const b64Parts=await Promise.all(b64Files.map(read));
      const hexParts=await Promise.all(hexFiles.map(read));
      const arrays=b64Parts.map(text=>Uint8Array.from(atob(text.replace(/\s/g,"")),c=>c.charCodeAt(0)));
      for(const text of hexParts){
        const hex=text.replace(/\s/g,"");
        if(hex.length%2)throw new Error("网站数据不完整");
        const bytes=new Uint8Array(hex.length/2);
        for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(hex.slice(i*2,i*2+2),16);
        arrays.push(bytes);
      }
      const total=arrays.reduce((n,a)=>n+a.length,0);
      const bytes=new Uint8Array(total);let offset=0;
      for(const a of arrays){bytes.set(a,offset);offset+=a.length}
      if(!("DecompressionStream" in window))throw new Error("当前浏览器版本过低，请使用最新版 Chrome、Edge 或 Safari");
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      const html=await new Response(stream).text();
      document.open();document.write(html);document.close();
    }catch(error){
      document.body.innerHTML=`<div style="font-family:system-ui;padding:32px;line-height:1.7"><h2>网站加载失败</h2><p>${String(error&&error.message||error)}</p><p>请刷新页面，或使用最新版 Chrome / Edge 浏览器。</p></div>`;
    }
  })();
  </script>
</body>
</html>
